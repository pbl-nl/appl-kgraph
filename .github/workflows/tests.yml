name: Windows and Linux tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: appl-kgraph.yml
          activate-environment: appl-kgraph
          # Avoid conda init failures on Windows; use conda run below.
          run-init: "false"
          remove-profiles: "false"
      - name: Install Linux DOCX converter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Test
        run: conda run --no-capture-output -n appl-kgraph python -m pytest test -q
